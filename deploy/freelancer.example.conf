# ─────────────────────────────────────────────────────────────────────────────
# freelancer.example.com — vhost nginx mẫu (đổi freelancer.example.com thành domain của bạn)
#
# Kiến trúc:
#   /srv/freelancer   mã nguồn + docker-compose trên host
#   127.0.0.1:8001                   container api (FastAPI) — proxy_pass
#
# Cài:
#   scp deploy/freelancer.example.conf → /etc/nginx/sites-available/freelancer.example.com
#   ln -s /etc/nginx/sites-available/freelancer.example.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d freelancer.example.com   # tự chèn khối ssl bên dưới
# ─────────────────────────────────────────────────────────────────────────────

server {
    server_name freelancer.example.com;

    # API nhận JSON — không cần upload lớn.
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        text/javascript
        text/css
        text/plain
        image/svg+xml;

    # Chặn lộ file nhạy cảm (giống các vhost khác trên server này).
    location ~* \.(env|log|key|pem|bak|backup|old|orig|save|swp|tmp|db|sqlite|sqlite3|db-journal|db-wal|db-shm)$ {
        deny all;
        return 404;
    }
    location ~* /(package\.json|tsconfig\.json|composer\.json|composer\.lock|package-lock\.json)$ {
        deny all;
        return 404;
    }

    # ── Toàn bộ request proxy sang container api ────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}